<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Burned Out but Bonded</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <meta name="color-scheme" content="dark light">
</head>
<body>
  <main>
    <div class="card">
      <p id="line"></p>
      <footer><small>SVU • Burned Out but Bonded</small></footer>
    </div>
  </main>
  <script>
    const lines = ["Assignment accepted. You are now on call.", "Please hold...assigning trauma.", "Mandatory therapy unlocked.", "You're coping incorrectly.", "Congratulations you triggered a forensic interview.", "Tree-top it.", "Thank you for your mediocre work product.", "We laugh so we don’t cry. Mostly.", "Therapy? No thanks, we have each other.", "I can’t. I’m on call."];
    const pick = () => lines[Math.floor(Math.random()*lines.length)];
    document.getElementById('line').textContent = pick();
  </script>
</body>
</html>
